<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f7f9ff">
<title>Join Our Telegram Channel</title>
<style>
  :root{
    --blue: #4f6df5;
    --violet: #6b5bf0;
    --ink: #14162b;
    --muted: #8992a6;
    --card-line: #eceff5;
    --bg: #f7f9ff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background:
      radial-gradient(700px 400px at 50% -5%, rgba(107,91,240,0.10), transparent 60%),
      var(--bg);
    min-height:100%;
    display:flex;
    justify-content:center;
    color: var(--ink);
  }

  .page{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 28px 110px;
  }

  .logo{
    width:96px; height:96px;
    border-radius:26px;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 20px 40px -14px rgba(79,109,245,0.28);
    margin-bottom:26px;
  }
  .logo img{ width:64px; height:64px; object-fit:contain; }
  .logo svg{ width:56px; height:56px; }

  .badge{
    display:flex;
    align-items:center;
    gap:8px;
    background: #eef1ff;
    color: #4f5fd6;
    font-size:13.5px;
    font-weight:600;
    padding:8px 18px;
    border-radius:999px;
    margin-bottom:24px;
  }
  .badge .dot{
    width:7px; height:7px;
    border-radius:50%;
    background: var(--blue);
  }

  h1{
    text-align:center;
    font-size:38px;
    font-weight:800;
    line-height:1.15;
    letter-spacing:-0.5px;
    margin-bottom:16px;
  }
  h1 .accent{
    background: linear-gradient(90deg, var(--blue), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub{
    text-align:center;
    font-size:15.5px;
    line-height:1.6;
    color: var(--muted);
    max-width:340px;
    margin-bottom:36px;
  }

  .redirect-card{
    width:100%;
    background:#fff;
    border:1px solid var(--card-line);
    border-radius:20px;
    padding:30px 24px 26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow: 0 24px 48px -30px rgba(20,22,43,0.18);
    margin-bottom:24px;
  }

  .redirect-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.6px;
    color:#5b6478;
    margin-bottom:22px;
    text-transform:uppercase;
  }
  .redirect-title svg{ width:16px; height:16px; }

  .ring-wrap{
    position:relative;
    width:120px; height:120px;
    margin-bottom:20px;
  }
  .ring-wrap svg{ width:120px; height:120px; transform: rotate(-90deg); }
  .ring-bg{ stroke:#eef0f6; }
  .ring-fg{
    stroke: url(#ringGradient);
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }
  .ring-number{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    font-weight:800;
    color: var(--ink);
  }

  .status-main{
    font-size:16px;
    font-weight:700;
    color: var(--ink);
    margin-bottom:4px;
  }
  .status-sub{
    font-size:13.5px;
    color: var(--muted);
  }

  .footer-note{
    font-size:11.5px;
    color:#b7bdcc;
    text-align:center;
  }

  .cta-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    display:flex;
    justify-content:center;
    padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(247,249,255,0), var(--bg) 40%);
  }
  .cta{
    width:100%;
    max-width:440px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:17px 18px;
    background: linear-gradient(90deg, var(--blue), var(--violet));
    color:#fff;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.3px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    text-decoration:none;
    box-shadow: 0 18px 34px -12px rgba(79,109,245,0.55);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .cta:hover{ transform: translateY(-2px); }
  .cta:active{ transform: translateY(0); }
</style>
</head>
<body>

  <div class="page">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 15l4-6 4 3 5-8" stroke="#22c07a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 4h4v4" stroke="#22c07a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="badge">
      <span class="dot"></span>
      Telegram Channel
    </div>

    <h1 id="channelName">Stock <span class="accent">Learners</span></h1>
    <p class="sub">Get instant updates, exclusive content and the latest information directly on Telegram.</p>
